<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"> 
    <title>MIPsystem - Gerenciar Fazendas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <h1>MIPsystem - Gestão de Fazendas</h1> 
    
    <!-- Formulário que atende criar e editar -->
    <form id="form-registro"> 
        <input type="hidden" id="id-edicao"> 
        
        <label>Nome da Fazenda:</label>
        <input type="text" id="nome_fazenda"> 
        
        <label>Município/UF:</label>
        <input type="text" id="municipio"> 
        
        <label>Área Total (ha):</label>
        <input type="number" id="area_total" step="0.01"> 
        
        <button type="submit">Salvar Registro</button>
    </form>

    <hr>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Município</th>
                <th>Área (ha)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">
            <!-- Registros injetados via JavaScript -->
        </tbody>
    </table>

    <!-- Ordem correta de carregamento dos scripts -->
    <script src="dados/script-inicial.js"></script> 
    <script src="js/banco.js"></script> 
    <script src="js/crud.js"></script> 
    <script src="js/interface.js"></script> 
</body>
</html>
